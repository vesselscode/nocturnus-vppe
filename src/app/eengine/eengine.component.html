<div class="engine-container">
  <div

    
    *ngIf="pistonPosition === 'up'; else pistonIsDown"
  >
    <h1>O vampiro está meio-morto</h1>
    <button (click)="pistonDown()">Piston Down</button>

  </div>

  <ng-template 
  
     #pistonIsDown
  >
      <h1>O vampiro morreu</h1>
      <button (click)="pistonUp()">Piston Up</button>
      
  </ng-template>

  <div>
    <h1></h1>
  </div>
</div>
